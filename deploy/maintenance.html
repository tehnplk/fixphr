<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>อยู่ระหว่างการบำรุงรักษาระบบ | หมอพร้อม</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: clamp(16px, 3vw, 42px);
        color: #173f34;
        background:
          radial-gradient(circle at 92% 8%, rgba(189, 225, 198, 0.7), transparent 30%),
          radial-gradient(circle at 5% 92%, rgba(236, 218, 157, 0.38), transparent 26%),
          #e8eee5;
        font-family: "Noto Sans Thai", "Leelawadee UI", "Tahoma", sans-serif;
      }

      .card {
        width: min(560px, 100%);
        padding: clamp(30px, 6vw, 56px);
        background: #f8f6ef;
        border: 1px solid rgba(25, 86, 59, 0.14);
        box-shadow: 0 24px 70px rgba(44, 75, 56, 0.14);
        text-align: center;
      }

      .office {
        margin: 0 0 26px;
        color: #6b8880;
        font-size: clamp(13px, 3.4vw, 15px);
        font-weight: 600;
      }

      .icon {
        width: 76px;
        height: 76px;
        display: grid;
        place-items: center;
        margin: 0 auto 26px;
        color: #08704e;
        background: rgba(8, 112, 78, 0.09);
        border: 1.5px solid rgba(8, 112, 78, 0.3);
        border-radius: 10px;
      }

      .icon svg {
        width: 38px;
        height: 38px;
      }

      h1 {
        margin: 0 0 12px;
        color: #0b6d4d;
        font-size: clamp(20px, 5.2vw, 27px);
        font-weight: 800;
        line-height: 1.5;
      }

      p {
        margin: 0;
        color: #315f52;
        font-size: clamp(15px, 4vw, 18px);
        font-weight: 600;
        line-height: 1.7;
      }

      p strong {
        color: #0b6d4d;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="office">สำนักงานสาธารณสุขจังหวัดพิษณุโลก</p>

      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <polyline points="12 7 12 12 15.5 14" />
        </svg>
      </div>

      <h1>อยู่ระหว่างการบำรุงรักษาระบบ</h1>
      <p>กรุณากลับมาใหม่ในอีก <strong>20 นาที</strong></p>
    </main>
  </body>
</html>
