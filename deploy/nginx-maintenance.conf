# Shows a maintenance card instead of nginx's bare "502 Bad Gateway" while the
# app container is rebuilding or restarting.
#
# Install on the host (the panel includes every *.conf from this directory, so
# a panel edit to the main vhost will not drop it):
#   cp deploy/maintenance.html /www/wwwroot/fixphr.plkhealth.go.th/maintenance.html
#   sudo cp deploy/nginx-maintenance.conf \
#     /www/server/panel/vhost/nginx/extension/fixphr.plkhealth.go.th/maintenance.conf
#   sudo nginx -t && sudo nginx -s reload

# 503 rather than the upstream's 502, so crawlers treat the outage as temporary
error_page 502 503 504 =503 /maintenance.html;

location = /maintenance.html {
    root /www/wwwroot/fixphr.plkhealth.go.th;
    internal;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 1200 always;
}
